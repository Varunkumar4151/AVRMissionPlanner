name: AVR Linux Build (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel mono-runtime libgdiplus fonts-dejavu-core rsync
      - name: Build from source on Linux
        run: ./Linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AVRMissionPlanner-linux-x86_64
          path: |
            bin/linux/AVRMissionPlanner-linux-x86_64.tar.gz
            bin/linux/AVRMissionPlanner-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
