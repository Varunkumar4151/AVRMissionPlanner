name: AVR Android APK (manual, legacy Xamarin required)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify legacy Xamarin toolchain
        shell: pwsh
        run: ./Android/build.ps1 -CheckOnly
      - name: Build development APK
        shell: pwsh
        run: ./Android/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AVRMissionPlanner-Android-development
          path: bin/android/*-Signed.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVR-Android-build-log
          path: bin/android/build.log
